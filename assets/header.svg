<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1a"/><stop offset="1" stop-color="#1a1033"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7c3aed" stroke-opacity="0.15"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="type"><rect x="0" y="120" height="40" width="0">
      <animate attributeName="width" values="0;0;520;520;0" keyTimes="0;0.05;0.55;0.9;1" dur="7s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>
  <rect width="900" height="200" rx="14" fill="url(#bg)"/>
  <rect width="900" height="200" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="898" height="198" rx="14" fill="none" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
  <rect y="0" width="900" height="3" fill="#c084fc" opacity="0.6">
    <animate attributeName="y" values="0;200;0" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="95" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="56" font-weight="bold" fill="#e9d5ff" filter="url(#glow)" letter-spacing="8">ALISTO</text>
  <g transform="translate(190,0)" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#c084fc">
    <text x="0" y="145" clip-path="url(#type)">&gt; Computer Science &amp; Mathematics_</text>
  </g>
  <text x="450" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#7c3aed">Learn → Build → Break → Fix → Repeat</text>
</svg>
