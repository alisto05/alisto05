<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="30" width="900" height="2" fill="url(#g)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cy="31" r="4" fill="#e9d5ff" filter="url(#glow)">
    <animate attributeName="cx" values="0;900" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="450" y="65" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#a78bfa">
    Still learning. Still building. Still becoming.
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
